# Dependabot keeps MiroShark's dependencies current across every ecosystem in
# the repo. Every version update (major included) is grouped into a single PR
# per ecosystem each week, so CI runs once per ecosystem instead of once per
# bump (single-bump PRs were mostly closed and re-batched by hand). Security
# updates still open on their own. Commit messages use the repo's existing
# `chore:` prefix for dependency bumps.
version: 2
updates:
  # Python backend (requirements.txt + pyproject.toml). camel-ai is exact-pinned
  # at 0.2.78; Dependabot surfaces newer releases as reviewable, CI-tested PRs
  # instead of silently floating the pin.
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      backend-weekly:
        patterns:
          - "*"

  # Root npm package (dev tooling — concurrently).
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      root-npm-weekly:
        patterns:
          - "*"

  # Frontend npm package (Vue 3 + Vite app).
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      frontend-weekly:
        patterns:
          - "*"

  # GitHub Actions used by tests.yml and docker-image.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore"
    groups:
      actions-weekly:
        patterns:
          - "*"

  # Docker base image (python:3.11) used by the published container.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    commit-message:
      prefix: "chore"
    groups:
      docker-weekly:
        patterns:
          - "*"
    # torch 2.13 has no Python 3.15 wheel (and no sdist), so `uv sync --frozen`
    # in the images fails on 3.15 (#343). Drop this once torch ships 3.15 wheels.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]
