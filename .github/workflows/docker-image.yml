name: Build and push Docker image

on:
  push:
    tags: ["*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    # The Blacksmith Docker actions only run on Blacksmith, so forks skip this.
    if: github.repository_owner == 'MiroShark'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Blacksmith builder: Docker layers persist on a sticky disk between runs
      # (cache-key = Dockerfile). Replaces setup-buildx; QEMU was unused (one
      # platform).
      - name: Set up Docker builder
        uses: useblacksmith/setup-docker-builder@v2
        with:
          cache-key: Dockerfile

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/miroshark
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest

      - name: Build and push
        uses: useblacksmith/build-push-action@v2
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
